spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update   # Hibernate will create/update tables from your entities
    show-sql: true       # Optional: see SQL queries in console
  sql:
    init:
      mode: never        # Disable schema.sql execution
